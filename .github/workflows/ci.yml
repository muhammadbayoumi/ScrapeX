name: CI

# PUSH IS NARROWED TO main, AND THAT IS THE WHOLE OF #646. Unfiltered, every
# commit on a branch with an open pull request ran this matrix TWICE. Measured
# over 2026-08-11..09-10 from the Actions API: 1,322 runs across 820 SHAs, 465
# of them run twice, and the duplicate copies cost 8,591 of 23,369 runner-
# minutes — 36.8%. (#646 quotes 617 runs and 11,529 minutes for the same shape;
# that is the most recent 617 runs, not the window, and it reproduces on that
# slice. The share it derives, 38%, is the number that survives.) Every branch
# commit is still covered by the `pull_request` run, and main keeps its
# post-merge run, so nothing loses coverage.
#
# WHAT DOES CHANGE, and it is a behaviour change rather than a tidy-up: a branch
# with NO open pull request stops being tested on push. Work travels here as
# branch -> PR -> squash, so that window is the time before the PR is opened.
#
# It also removes an ambiguity the duplication created. The two runs tiered
# differently — `push` computed the scope base from the branch's previous tip,
# `pull_request` from the base commit — and both rows were called `test`, so a
# reader who opened the wrong one could see `test` pass while the engine tier
# never ran. Only the run that describes the whole change is left.
on:
  push:
    branches: [main]
  pull_request:

# THE TOKEN IS READ-ONLY HERE, said out loud rather than inherited. Nothing in
# this workflow writes to the repository — `upload-artifact` needs no token
# permission at all — and the repository default can be widened by a settings
# change nobody reviews. The four workflows that DO write already declare theirs
# (`tag-the-release.yml` needs `contents: write` and `actions: write`), so this
# is the same discipline applied to the file that runs on every push.
permissions:
  contents: read

# A SUPERSEDED RUN IS AN ANSWER ABOUT A COMMIT NOBODY IS WAITING ON. Pushing
# again to a branch used to leave the previous matrix running to completion —
# a median full run is ~13 minutes of wall clock and ~22 runner-minutes, spent
# describing a tree that has already moved (#647).
#
# `main` LEAVES THE GROUP ENTIRELY, and `cancel-in-progress: false` would NOT
# have been enough. GitHub's rule is that "any existing pending job or workflow
# in the same concurrency group will be canceled" — unconditionally, whatever
# `cancel-in-progress` says, because that flag governs only the RUNNING slot.
# A group holds one running and one pending run, so three merges inside one
# run's wall clock evict the middle one while it is still pending.
#
# THAT WOULD COST A RELEASE, NOT JUST A ROW. `tag-the-release.yml` consumes this
# workflow through `workflow_run` and tags only on `conclusion == 'success'`; a
# cancelled run publishes nothing, so a `VERSION` bump merged in the middle of a
# burst would never be tagged — the defect R-87 built that mechanism to remove.
# Simulated over the last 297 squash merges at the 13.2-minute median run:
# 10 of them (3.4%) would have lost their post-merge run.
#
# `github.run_id` is unique per run, so main's expression yields a group of one
# and nothing of main's is ever grouped or cancelled. Pull requests group by
# `refs/pull/<n>/merge`, unique per PR — two PRs on the same head branch cannot
# collide, and no PR can share a group with main.
#
# It is NOT a flake remedy. With CI on both triggers an intermittent had two to
# four chances to fire per SHA and now has fewer, which lowers exposure without
# fixing a single flaky test — see #649 for the ones that are real.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ITS OWN JOB, and deliberately not a step inside `test`. A style failure that
  # aborts the suite hides every real failure behind it, and the one thing a
  # linter must never do is cost someone the answer they actually came for.
  # It is also seconds long, so the cheap things fail fast.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter turns somebody else's release into a red
      # build on a branch that changed nothing.
      - name: Install ruff
        run: pip install ruff==0.16.2
      # scrapex/ ONLY, and the reason is written down rather than left to be
      # guessed: tests/ and tools/ carry 376 findings today, nearly all of them
      # import order, and they are the files a second session is editing right
      # now. Gating them would mean a conflict per commit for no defect
      # prevented. The gate covers everything that SHIPS; widening it to the
      # whole tree is its own task, once that work lands.
      - name: Lint the code that ships (ruff)
        run: ruff check scrapex/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned for the same reason ruff is, and installed for the length of one
      # step: nothing is added to package.json because there ISN'T one, and the
      # extension's security story is that it ships no third-party JavaScript.
      - name: Lint the JavaScript (eslint)
        run: npx --yes eslint@9.39.0 extension scrapex/webui/static contract apps_script --no-warn-ignored

  # ITS OWN JOB, and it was a step inside `test` until 2026-08-19. It was split
  # out when TWO jobs needed the answer and had to run in parallel; #645 removed
  # the second, so `test` is the only consumer left and the original reason is
  # spent. It stays a job here because folding it back is a separate change with
  # its own argument, not a rider on a cost fix — recorded as an issue.
  #
  # It is seconds long: a checkout and a `git diff --name-only`. No Python.
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope step below diffs against the base branch, which needs
          # more than the single commit a shallow checkout fetches.
          fetch-depth: 0
      - name: What did this change touch?
        id: scope
        # THIS DECIDES WHICH SUITE RUNS, AND IT IS A JOB OUTPUT RATHER THAN A
        # `paths:` FILTER ON PURPOSE. A workflow- or job-level `paths:` filter
        # makes the consuming job not exist, and a required check that does not
        # exist stays pending forever — the pull request can never merge. A job
        # that always runs, plus step-level `if:` on the expensive steps, leaves
        # every check reporting on every change, which is what branch protection
        # needs.
        #
        # The rule is deliberately one-sided. `extension` means every changed
        # file is inside extension/ or the documentation set; `docs` means every
        # changed file is documentation and nothing else. Anything else — one line
        # in scrapex/, one line in tests/, a workflow edit — runs the whole suite
        # exactly as before. An unknown event, an empty diff, or a failure to
        # compute the base all fall through to "run everything", because the
        # expensive mistake here is skipping a suite, never running one twice.
        #
        # WHY THE DOCUMENTATION SET IS MORE THAN `docs/`. Measured on PR #214,
        # which was documentation only: it changed CLAUDE.md, ENGINEERING.md,
        # README.md, .gitignore and a file under .claude/, none of which match
        # `^docs/`. It took the FULL suite twice — 14m21s and 14m40s, the two
        # slowest runs of the last twenty. The documentation system C1 sends every
        # session to read lives partly at the repository ROOT, so this filter has
        # to know that, or the system's own pull requests are the slowest kind
        # there is.
        #
        # `.github/` IS DELIBERATELY ABSENT from both sets. A workflow edit
        # changes what CI itself guarantees, so it runs everything — including an
        # edit to this very file.
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi

          # A BRANCH'S FIRST PUSH HAS NO PREVIOUS TIP. `github.event.before` is
          # forty zeros, so the block above leaves `base` empty and everything
          # falls through to the full suite — measured: an extension-only change
          # ran 9m59s on its push and 3m28s on its pull request, paying for the
          # engine suite once anyway. Compare against main instead, which is
          # what the change will actually be merged into.
          #
          # On main itself this deliberately finds nothing: `origin/main` IS the
          # commit, the diff is empty, and an empty diff already means "run
          # everything". The branch that everything merges into is the last
          # place to run a subset.
          if [ -z "$base" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            git fetch --quiet origin main 2>/dev/null || true
            if git rev-parse --verify --quiet origin/main >/dev/null; then
              base=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || true)
              echo "no previous tip; comparing against main at ${base:-<none>}"
            fi
          fi

          # Documentation, in the sense of "a file whose only readers are the
          # document guards". docs/, .claude/, any Markdown at the root, and
          # .gitignore. CHANGELOG.md is in here and is GENERATED, which is why
          # tests/test_version.py carries the docs mark: the guard that catches a
          # hand-edited CHANGELOG has to run on the change that hand-edits it.
          documentation='^(docs/|\.claude/|[^/]+\.md$|\.gitignore$)'

          scope=full
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # --no-renames, AND THAT IS NOT A DETAIL. Rename detection is on
            # by default and `--name-only` then prints only the DESTINATION of a
            # move: `git mv scrapex/webui/templates/settings_partial.html
            # extension/settings.html` reports one path under extension/, so the
            # diff classifies as `extension` and the engine suite never runs on a
            # change that deleted an engine template. Reproduced in a scratch
            # repository. Without rename detection both paths appear, and the
            # only direction this moves the answer is WIDER.
            changed=$(git diff --name-only --no-renames "$base" "${{ github.sha }}")
            if [ -n "$changed" ]; then
              # Narrowest first. A change that is documentation AND extension is
              # an extension change; only an all-documentation diff is `docs`.
              if ! echo "$changed" | grep -qvE "$documentation"; then
                scope=docs
              elif ! echo "$changed" | grep -qvE "^(extension/)|$documentation"; then
                scope=extension
              fi
            fi
            echo "changed files:"
            echo "$changed" | sed 's/^/  /'
          else
            echo "no usable base commit; running everything"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "SCOPE: $scope"

  test:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, and it is not for the scope diff. Two guards in this
          # suite ask git when something last really changed, and BOTH SKIP
          # rather than fail on a grafted clone:
          #   tests/test_the_privacy_policy_is_true.py:433 -- the "Last updated"
          #     staleness guard, added 2026-08-12 after the policy was edited
          #     three times in a day while still claiming an older date;
          #   tests/test_version.py:231 -- every capability's cited commit hash.
          # A depth-1 checkout turns both into skips, which `-q` reports as green.
          # Measured: edit docs/privacy-policy.md, leave its date, and full
          # history fails while depth 1 passes.
          #
          # publish-docs.yml and release-extension.yml pin this for the same
          # reason, and the helper's own comment names them. This job was the
          # third, briefly, in the commit that split the scope job out.
          # tests/test_the_workflows_check_out_enough_history.py now guards it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Measured 2026-08-19: nothing in .github/workflows/ cached anything.
          # `pip install -e .[dev,browser]` is a steady 11s, so this is small --
          # but it is one line and it never costs more than it saves.
          cache: pip
          cache-dependency-path: pyproject.toml
      # The browser download is a steady ~13s of the Install step and is keyed on
      # nothing but the playwright version, which changes when pyproject does.
      # The apt half of `--with-deps` is what actually swings -- 9.4s on
      # 2026-08-17 against 104s on 2026-08-19, on the same command -- and no
      # cache can fix that, because it is the runner image's package mirror.
      - name: Cache the browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ms-playwright-${{ runner.os }}-
      - name: Install
        # The browser extra is installed HERE and not moved into [dev]: the
        # panel suite needs a real Chromium, and putting playwright in the extra
        # every contributor installs would make `pip install -e .[dev]` download
        # a browser on every machine for a suite most changes never touch. CI is
        # the place that must run everything.
        run: |
          pip install -e .[dev,browser]
          python -m playwright install --with-deps chromium

      - name: Validate the manifest (S5 gate — a broken contract can't merge)
        run: python -m scrapex.cli validate-manifest

      - name: Every browser-driven suite must RUN, not skip
        # A suite that opens with pytest.importorskip("playwright") collects
        # NOTHING when the browser is absent, and pytest reports that as a
        # skip — not a failure. It happened: 48 behavioural tests, including the
        # panel's only XSS guard, were reported as a green suite for months.
        #
        # THE FILES ARE DISCOVERED, NOT NAMED. This step named test_panel_dom.py
        # alone until 2026-08-15, and tests/test_tab_page_dom.py — written that
        # day, to catch a defect no static test could — would have vanished the
        # same silent way. A guard that lists its subjects fails on the one
        # nobody added to the list.
        run: |
          # `-q --collect-only` prints one summary line per file:
          #   tests/test_panel_dom.py: 53
          # so the count is the trailing number. tr strips the CR a
          # Windows checkout leaves there, which would eat the match.
          collected() {
            python -m pytest "$1" --collect-only -q | tr -d '\r' \
              | grep -oE ': [0-9]+$' | grep -oE '[0-9]+' | tail -1
          }
          # tests/*.py, NOT -r: a recursive grep also matches the compiled
          # copies under __pycache__, whose names collect nothing and would fail
          # this step for a reason that has nothing to do with the browser.
          # NO CLOSING QUOTE AFTER playwright, and that is the whole fix. This
          # read `importorskip("playwright"` until 2026-08-19, so
          # tests/test_grid_dom.py:24 -- which writes
          # `pytest.importorskip("playwright.sync_api")` -- never matched, and its
          # 20 browser-driven tests were invisible to the guard for as long as
          # they existed. That is precisely the silent failure the comment above
          # describes, arrived at through the guard's own pattern rather than
          # through a forgotten filename.
          suites=$(grep -l 'importorskip("playwright' tests/*.py | tr -d '\r' | sort)
          echo "browser suites found:"; echo "$suites"
          test -n "$suites"
          for suite in $suites; do
            count=$(collected "$suite")
            echo "  $suite: ${count:-0}"
            # Any zero means the browser is missing and the suite skipped.
            test "${count:-0}" -ge 1
          done
          # The panel's own floor stays a NUMBER, because the count is the thing
          # that regressed before and a per-file "at least one" would not have
          # noticed 48 becoming 1.
          test "$(collected tests/test_panel_dom.py)" -ge 40
          # AND THE SAME REASONING NOW COVERS THE TWO SUITES THAT DRAW THE DATA
          # PAGE, because the sentence above was true of them and applied to
          # neither. Counted 2026-08-26 with `--collect-only -q`, not remembered:
          # test_grid_dom.py 24, test_tab_page_dom.py 10. Both sat on the `-ge 1`
          # floor, so either could have fallen to a single test and stayed green.
          # (grid_dom collected 20 before the four tests that draw the moved-column
          # card and press the AR|EN toggle landed alongside this.)
          #
          # They are named because the plan that moves the source page into the
          # extension proves steps 1, 3 and 4 through these two files and no
          # others, and its own argument for them is that the Data page already
          # shipped BROKEN once with 2,460 engine and 398 extension tests green
          # on it. A gate defending against that must not be the loosest one.
          test "$(collected tests/test_grid_dom.py)" -ge 24
          test "$(collected tests/test_tab_page_dom.py)" -ge 10

      - name: The extension gate must not have emptied
        # The same reasoning as the line above, for the set the split depends
        # on. 325 of 2020 tests carried the mark when the split was made and
        # **661 of 2,656 do today** — counted 2026-08-19 with
        # `pytest -m extension --collect-only -q`, not remembered. The old figure
        # had been quoted stale for a while, which is its own small instance of
        # the thing this file keeps guarding against. A file that reads extension/ and
        # forgets the mark stops running on exactly the pull requests it was
        # written for, and nothing goes red.
        # tests/test_the_extension_gate_is_complete.py catches the missing mark;
        # this catches the set being emptied some other way.
        #
        # The per-file lines are summed rather than read off pytest's
        # `N/M tests collected` summary: `addopts` carries `-q`, and under `-q`
        # that summary is not printed at all — the tail of the output is the
        # warnings block. The first version of this step grepped for the
        # summary, matched nothing, and failed the build with `count` empty,
        # which is at least the safe direction to be wrong in.
        run: |
          python -m pytest -m extension --collect-only -q | tr -d '\r' | tee /tmp/gate.txt | tail -20
          count=$(grep -oE ': [0-9]+$' /tmp/gate.txt | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "extension gate collected: ${count}"
          test "${count}" -ge 300

      - name: The docs gate must not have emptied either
        # Same reasoning again, for the set the `docs` scope depends on.
        # tests/test_the_docs_gate_is_complete.py catches a test file that reads
        # a document and forgets the mark; this catches the set being emptied
        # some other way. The floor is small because the set is small — six files
        # when it was made — and a floor of 1 would let five of them vanish.
        run: |
          python -m pytest -m docs --collect-only -q | tr -d '\r' | tee /tmp/docsgate.txt | tail -20
          count=$(grep -oE ': [0-9]+$' /tmp/docsgate.txt | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "docs gate collected: ${count}"
          test "${count}" -ge 150

      - name: Documents only (this change touched nothing a document does not own)
        if: needs.scope.outputs.scope == 'docs'
        # THE TIER PR #214 SHOULD HAVE HAD. It was documentation only and paid
        # 14m21s for the full suite; this runs the guards that a document can
        # actually break -- the citation guard, the generated data-page ruling,
        # the privacy policy, the version ledger's CHANGELOG -- and stops.
        #
        # It is NOT `-m "docs or extension"`: no extension file changed, so the
        # panel suite has nothing to say. Files that guard both carry both marks
        # and run here regardless.
        run: python -m pytest -m docs

      - name: Extension gate only (this change touched nothing else)
        if: needs.scope.outputs.scope == 'extension'
        # THE POINT OF THE SPLIT. A button change runs the 325 tests that guard
        # the extension and stops there. The engine suite is not skipped by
        # being unreachable — it is skipped because nothing it tests changed.
        #
        # `or docs` because this scope admits documentation files too, and the
        # docs set is not a subset of the extension set --
        # tests/test_the_ruling_matches_the_code.py reads
        # docs/data-page-schema.md and carries no extension mark, so before this
        # line an extension+docs change could hand-edit that generated ruling and
        # pass. Strictly more coverage than the old `-m extension`, and the two
        # sets overlap so the cost is a few seconds.
        run: python -m pytest -m "extension or docs"

      - name: Tests (Python engine + Python-vs-frozen contract)
        if: needs.scope.outputs.scope == 'full'
        # THE FULL SUITE, ONCE, AGAINST THE REAL MIGRATION STREAM. This ran on
        # `tests/conftest.py`'s schema template until #645, with a second job
        # replaying the real stream beside it — the same 3,600 tests twice, for
        # a difference the squash had already collapsed.
        #
        # THE ARGUMENT IS "RUN IT ONCE, PROPERLY", NOT "THE REAL STREAM BUYS
        # NOTHING". Every pull request now exercises the real stream, which
        # before this only the second job did, so this is strictly MORE
        # protection than the step it replaces.
        #
        # WHAT IT COSTS, MEASURED ON CI, not on a developer machine. Run
        # 34428035437 ran both suites off one tree: this step unflagged 651s,
        # the deleted job's identical `pytest -q` flagged 743s. So +92s, +14.1%.
        # #645 budgeted +15.7s, measured when db/engine/migrations/ was EMPTY —
        # 0018 through 0020 have landed since, so every real migrate() replays
        # the baseline and three files instead of one. The 396ms-per-call figure
        # this comment used to carry is older still: it measured the 57-file
        # chain R-84 squashed away. (Locally the delta is +73s and +100s, which
        # brackets 92s; the PERCENTAGE does not travel, because a local suite is
        # ~345s against CI's ~651s.)
        #
        # AND IT BUYS COMPUTE, NOT LATENCY — said this way because three earlier
        # versions of this paragraph each claimed a wall-clock result and each
        # was falsified by the next CI run. The job removed ran in PARALLEL, so
        # what a merge waited on was max(test, migration-authority): 700-851s,
        # median 782.5s, over the base branch's six runs. This step now decides
        # alone and carries +92s it did not carry before, which puts it in the
        # same band. Four runs against a 151s spread resolve nothing, and the
        # early ones leaned each way in turn.
        #
        # SO NO NUMBER FOR THE CRITICAL PATH IS RECORDED HERE. Whoever needs one
        # should measure it from the Actions API over a real sample rather than
        # trust a figure in a comment — the four that were written here were
        # stale within a day, each time by a single run. What does not move is
        # the compute: 69.5% of this workflow's billed runner-minutes across all
        # three edits, over 1,322 runs.
        #
        # WHAT IS MEASURED IS THE COMPUTE: 69.5% of this workflow's billed
        # runner-minutes across all three edits, over 1,322 runs. That is the
        # win being bought, and it does not need a latency story.
        #
        # THE FLAG IS ON THIS STEP, NOT ON THE JOB, and that is load-bearing.
        # The seven tests in tests/test_fast_migrations.py SKIP when it is set,
        # and the step below is their only remaining home; a job-level `env:`
        # would reach that step too and silence them where nothing would notice.
        env:
          SCRAPEX_FULL_MIGRATIONS: "1"
        run: python -m pytest -q

      - name: The schema template still has a suite, and the run above skips it
        if: needs.scope.outputs.scope == 'full'
        # SEVEN TESTS THAT ONLY RUN WITHOUT THE FLAG. They are the only thing
        # pinning the template mechanism `tests/conftest.py` uses to make a local
        # suite bearable. Until #645 they ran in THIS job, which had no flag —
        # the flag lived in the job that was deleted. Moving it onto the step
        # above took their home away, so they get a step of their own,
        # deliberately with no `env:` block.
        #
        # AND IT HAS A FLOOR, because without one the step is green either way:
        # all seven skip when the flag reaches them and pytest still exits 0
        # under `-q`. Measured: 7 passed without it, 7 skipped with it, exit 0
        # both times. That is the shape #644 hid for 25 commits, and the shape
        # the step below this one exists to stop.
        #
        # `raise SystemExit`, NOT `assert`: #833 is open against the sibling
        # floor below for exactly this — PYTHONOPTIMIZE strips an assert and the
        # step goes green with every test skipped.
        run: |
          python -m pytest tests/test_fast_migrations.py --junitxml=/tmp/fast.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("/tmp/fast.xml").getroot().find("testsuite")
          ran, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"fast-migrations: {ran} tests, {skipped} skipped")
          if skipped:
              raise SystemExit(
                  "the template suite skipped, so nothing pins the mechanism "
                  "tests/conftest.py restores from; SCRAPEX_FULL_MIGRATIONS has "
                  "reached this step")
          if ran < 7:
              raise SystemExit(f"the template suite ran {ran} tests, and there were seven")
          PY

      - name: The pre-squash suite must RUN, not skip
        # THE COLLECT-ONLY FLOORS ABOVE CANNOT SEE THIS ONE. A browser suite
        # disappears at COLLECTION; this file always collects six and loses five
        # at RUN TIME, because `pre_squash_chain` returns None and every test that
        # needs a real pre-squash database skips. `addopts` carries `-q`, so the
        # file then reports green. Measured in CI: 6 tests, 0 skipped, 1s.
        #
        # The subject is the owner's own warehouse, which predates the squash:
        # whether it still opens, upgrades, and refuses what it should is the one
        # question these six exist to answer. #318 added them and deleted
        # db/engine/migrations/ in the same commit, and their fixture asked
        # `origin/main` for that directory, so for the next 25 commits five of the
        # six skipped and the file reported green (#644). #678 replaced the moving
        # ref with a derivation. This step is what would have said so at the time.
        #
        # LAST, NOT BESIDE THE FLOORS IT RESEMBLES, and that is the whole reason
        # it sits here. Those floors are `--collect-only`: they can fail for a
        # missing suite and nothing else. This one EXECUTES six tests against
        # EngineDatabase, so it can go red for a product reason — and above the
        # suite it would abort the job and take the suite with it -- measured on
        # this branch, 638s of answers nobody then gets, the failure `lint` was
        # made its own job to avoid. Below it, a product defect reddens the suite
        # with every other answer already reported, and this step is left saying
        # only what nothing else can: that the six ran.
        #
        # A RED SUITE SKIPS THIS STEP, and that is not a hole: the job is already
        # failing, so no GREEN build ever reaches a merge without this having run
        # and passed. What the order costs is only how soon a skip is reported --
        # 46s before the suite, 685s after it, measured. That is the right trade,
        # because a skip is a CI-integrity fault nobody iterates on, while a
        # product failure is the thing someone is waiting on.
        #
        # SKIPS ARE COUNTED, NOT COLLECTIONS, and the floor is a number rather
        # than "at least one" for the same reason the panel's is: five of six
        # going quiet is exactly the shape that already happened.
        run: |
          python -m pytest tests/test_a_squashed_baseline_opens_what_it_should_and_refuses_the_rest.py \
            --junitxml=/tmp/pre-squash.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("/tmp/pre-squash.xml").getroot().find("testsuite")
          ran, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"pre-squash suite: {ran} tests, {skipped} skipped")
          assert skipped == 0, (
              "the pre-squash chain went unreachable and the suite skipped; these "
              "tests are the only proof his warehouse still opens")
          assert ran >= 6, f"the pre-squash suite ran {ran} tests, and there were six"
          PY

  contract-parity:
    # The two-engine guardrail: the JS engine must reproduce the FROZEN contract
    # vectors byte-for-byte, or two engines could fork one warehouse's history.
    #
    # Always runs, on every change, and is never scoped: it is seconds long, it
    # needs no Python, and it is the one gate that would go unwatched if either
    # side of the split forgot it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Contract parity gate (JS vs frozen normalize vectors)
        run: node contract/parity/parity.test.mjs
      - name: Extension unit tests (node:test — no package.json, no dependencies)
        # S2 asks for the extension's pure logic to be tested and nothing ever
        # ran it: there is no package.json in this repo and no JS runner. Node
        # ships one, and this job already has Node for the line above, so the
        # cost of the first guard here is zero.
        run: node --test extension/tests/*.test.mjs
      - name: Apps Script gate (the pasted file's own logic, run for real)
        # T1 exempts Apps Script from needing a test file because the contract
        # fixtures were said to be its suite. They are not: a fixture cannot
        # tell you whether the SHEET refuses a payload, and the refusal is the
        # thing that was costing the owner a re-paste. This runs the real
        # StagingAppScript.txt with a fake spreadsheet under it.
        run: node --test apps_script/tests/*.test.mjs
