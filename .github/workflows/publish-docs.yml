name: Publish the documents the store links to

# THE ORDERING PROBLEM THIS SOLVES, found the moment the website went up.
#
# mbiXsite's ScrapeX pages render `privacy-policy.md` and `support.md` straight
# from mbiX-hub rather than keeping their own copy — which is right, and was
# asked for in docs/SITE-BRIEF.md, because a retyped policy stops matching the
# extension the tests check it against.
#
# But those two files were published ONLY by release-engine.yml's publish job,
# which is gated on an `engine-v*` tag. So all three pages went live and
# rendered nothing, and the chain behind that is worse than an empty page:
#
#   the Chrome Web Store will not accept a listing without a WORKING privacy
#   policy URL  ->  the URL is the website page  ->  the page needs the markdown
#   in the hub  ->  the markdown needed a release  ->  the release is part of
#   the milestone the listing belongs to.
#
# The documents are not release artifacts. They describe what the extension asks
# for and how to get help, and both are true before anything is tagged. So they
# can be published on their own, whenever, by hand.
#
# THEY STILL GO OUT WITH EVERY RELEASE TOO, and that is not a duplicate. The
# policy's promises are asserted against the SHIPPED manifest by
# tests/test_the_privacy_policy_is_true.py — it must name every OAuth scope the
# extension asks for and every host it can reach — so each release republishing
# them is what keeps the published text describing the build that is out.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/privacy-policy.md"
      - "docs/support.md"
  # A DAILY LOOK AT WHAT IS ACTUALLY PUBLISHED, because the push trigger above
  # only fires when this repository changes and says nothing about whether the
  # publish SUCCEEDED or survived.
  #
  # Three ways the published copy drifts from this one, none of which touches
  # `docs/` here and so none of which the push trigger can see:
  #   * a publish run that failed after the tests and before the write
  #   * an edit made directly in mbiX-hub
  #   * a revert, a force-push, or a restore in that repository
  #
  # The owner asked for this on 2026-08-12 in terms of the DATE — "if the
  # published date differs from ours, run the workflow". The check below
  # compares the whole file rather than the date line, which is strictly
  # stronger: a date can match while the text underneath has moved, and it is
  # the text that makes promises. The date is reported because it is the line a
  # human reads first.
  schedule:
    # 04:11 UTC. An odd minute on purpose: GitHub queues every job scheduled on
    # the hour, and a policy check is not worth waiting in that queue.
    - cron: "11 4 * * *"

permissions:
  contents: read

# The same group as the release path: both write into mbiX-hub through the
# Contents API, and two writers on one file is a lost update.
concurrency:
  group: release-engine
  cancel-in-progress: false

env:
  PUBLIC_REPO: muhammadbayoumi/mbiX-hub

jobs:
  # WHAT IS PUBLISHED, AGAINST WHAT IS HERE. Runs on every trigger and decides
  # whether the publish job below has anything to do.
  #
  # On a push it will almost always say "drifted", which is correct and costs a
  # single fetch: this repository just changed and the hub has not. On the daily
  # schedule it is usually silent, which is the point — a scheduled job that
  # republishes unconditionally teaches everyone to ignore its runs.
  drift:
    runs-on: ubuntu-latest
    outputs:
      drifted: ${{ steps.compare.outputs.drifted }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare the published documents with these
        id: compare
        run: |
          set -uo pipefail
          RAW=https://raw.githubusercontent.com/muhammadbayoumi/mbiX-hub/main/ScrapeX/docs
          drifted=no
          for doc in privacy-policy support; do
            mine=$(sha256sum "docs/$doc.md" | cut -d' ' -f1)
            # NOT `curl -f`: a 404 is a real answer here — the document has
            # never been published — and it must read as drift rather than as a
            # broken check.
            theirs=$(curl -sL --max-time 20 "$RAW/$doc.md" 2>/dev/null | sha256sum | cut -d' ' -f1)
            here=$(grep -m1 'Last updated' "docs/$doc.md" || echo "(no date line)")
            there=$(curl -sL --max-time 20 "$RAW/$doc.md" 2>/dev/null | grep -m1 'Last updated' || echo "(unreadable)")
            if [ "$mine" != "$theirs" ]; then
              drifted=yes
              echo "::notice::$doc.md differs from what is published."
              echo "  here:      $here"
              echo "  published: $there"
            else
              echo "$doc.md matches what is published — $here"
            fi
          done
          echo "drifted=$drifted" >> "$GITHUB_OUTPUT"
          if [ "$drifted" = no ]; then
            echo "Nothing to publish. The website already carries these documents."
          fi

      - name: The chooser owners are actually sent to must be the one tested here
        # THIS WORKFLOW CANNOT FIX WHAT IT FINDS, AND MUST STILL LOOK.
        #
        # scrapex-picker.html is the only part of ScrapeX served from a web
        # server, and it is the part that handles a Google access token. It
        # lives in mbiXsite -- a different repository, published by hand -- so
        # every test in this repository asserts against a copy that nobody has
        # checked is the copy being served.
        #
        # It is in mbiXsite's public/ precisely so Vite copies it VERBATIM; a
        # build that transformed it would make the served page differ from the
        # tested one silently. This is what proves that held.
        #
        # A mismatch fails, loudly, because the alternative is a page handling
        # the owner's token that nobody reviewed.
        run: |
          set -uo pipefail
          PAGE=https://muhammadbayoumi.github.io/mbiXsite/scrapex-picker.html
          mine=$(sha256sum docs/picker/scrapex-picker.html | cut -d' ' -f1)
          served=$(curl -sL --max-time 20 "$PAGE" 2>/dev/null || true)
          theirs=$(printf '%s' "$served" | sha256sum | cut -d' ' -f1)

          if [ -z "$served" ]; then
            echo "::error::$PAGE served nothing. The panel's Choose an existing"
            echo "one button opens a page that does not exist."
            exit 1
          fi
          if [ "$mine" != "$theirs" ]; then
            echo "::error::the chooser served to owners is not the file this"
            echo "repository tests."
            echo "  repository: $mine"
            echo "  served:     $theirs"
            echo "Republish docs/picker/scrapex-picker.html to mbiXsite at"
            echo "public/scrapex-picker.html -- see docs/picker/README.md."
            exit 1
          fi

          # A hash proves sameness, not safety. These say what the sameness is
          # worth, so a future edit that ships a secret fails HERE as well as in
          # the unit tests -- the served copy is the one that can hurt anyone.
          for secret in "GOCSPX-" "client_secret" "refresh_token"; do
            if printf '%s' "$served" | grep -q "$secret"; then
              echo "::error::the published chooser contains $secret."
              echo "It is public. Revoke the credential, do not merely delete it."
              exit 1
            fi
          done
          echo "The chooser served to owners is byte-for-byte the tested file."

  publish:
    needs: drift
    # NO `if:` HERE, ON PURPOSE. It was on the job, and the comment beside it
    # claimed the tests still ran on every path -- which the `if:` itself made
    # false: skipping the job skipped the guards too. A daily run that found no
    # drift then proved nothing at all, while reporting green.
    #
    # The condition now sits on the two steps that WRITE. Everything that CHECKS
    # runs every time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the privacy-policy guards below ask git when a
          # document last really changed. A depth-1 clone grafts HEAD, so every
          # file looks newly added and the guard answers with HEAD's date for
          # everything -- confidently, and wrongly.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The promises must still be true of what ships
        # PUBLISHING IS NOT COPYING. This is the file that says which scopes the
        # extension asks for and which hosts it can reach, and it is checked
        # against the real manifest rather than trusted. Publishing it without
        # that check would put a policy on the web that describes an extension
        # nobody built.
        run: |
          pip install -e .[dev]
          python -m pytest -q tests/test_the_privacy_policy_is_true.py

      - name: Publish to the public delivery endpoint
        if: needs.drift.outputs.drifted == 'yes'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PUBLIC_SITE_TOKEN is not set."
            echo "The documents were checked and nothing was published."
            echo "Create a fine-grained personal access token with Contents:"
            echo "write on $PUBLIC_REPO and add it as the repository secret"
            echo "PUBLIC_SITE_TOKEN, then re-run this workflow."
            exit 1
          fi
          . .github/workflows/put-to-hub.sh
          for doc in privacy-policy support; do
            put_to_hub "ScrapeX/docs/$doc.md" "docs/$doc.md" \
              "ScrapeX docs, published from ${GITHUB_SHA:0:7}"
          done

      - name: The pages the store depends on must actually work
        if: needs.drift.outputs.drifted == 'yes'
        # PRINTING A URL IS NOT CHECKING IT. This step used to end by echoing
        # the two page addresses, which proves nothing: publishing can succeed
        # while the page stays blank for ever, and the chain that follows is the
        # one the whole listing hangs on.
        #
        #   the Chrome Web Store refuses a listing without a WORKING privacy
        #   policy URL  ->  the URL is a page that fetches this markdown at
        #   runtime  ->  if that fetch breaks, the page reads "Loading the
        #   policy..." and the publish still says success
        #
        # The first person to notice would be a Google reviewer rejecting the
        # submission, with nothing in any log to explain why.
        #
        # TWO THINGS BREAK INDEPENDENTLY, so both are checked:
        #   1. the markdown is reachable at the address the BROWSER uses --
        #      raw.githubusercontent.com, not the Contents API this job just
        #      wrote through. A successful write says nothing about the CDN.
        #   2. the page still carries `data-sx-doc`, the attribute the site's
        #      loader hooks onto. mbiXsite is a separate repository: a redesign
        #      there can drop it without anything here noticing.
        #
        # No browser and no JavaScript, deliberately. A headless check of the
        # RENDERED text would be the truest test and the flakiest one, and a
        # publish step that cries wolf gets ignored -- which is the failure it
        # was written to prevent.
        run: |
          set -uo pipefail
          RAW=https://raw.githubusercontent.com/muhammadbayoumi/mbiX-hub/main/ScrapeX/docs
          SITE=https://muhammadbayoumi.github.io/mbiXsite
          failed=0

          for doc in privacy-policy support; do
            # Up to five tries: the write above went through the Contents API
            # and raw.githubusercontent.com is a CDN behind it, so a few seconds
            # of lag is normal and is NOT a failure.
            for attempt in 1 2 3 4 5; do
              body=$(curl -fsSL --max-time 20 "$RAW/$doc.md" 2>/dev/null) && break
              sleep 5
            done
            if [ -z "${body:-}" ]; then
              echo "::error::$RAW/$doc.md is not readable, so the page that"
              echo "fetches it will show its 'waiting on its source' message."
              failed=1
              continue
            fi
            echo "  $doc.md: readable, $(printf '%s' "$body" | wc -c) bytes"
            body=""
          done

          for page in scrapex-privacy scrapex-support; do
            html=$(curl -fsSL --max-time 20 "$SITE/$page.html" 2>/dev/null) || {
              echo "::error::$SITE/$page.html did not load at all."
              failed=1; continue
            }
            case "$html" in
              *data-sx-doc*) echo "  $page.html: still hooks the loader" ;;
              *) echo "::error::$SITE/$page.html no longer carries data-sx-doc,"
                 echo "so nothing on it will ever fetch the document this job"
                 echo "just published. The page renders its heading and nothing"
                 echo "else, and the store listing depends on it."
                 failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "The documents WERE published. What broke is the path between"
            echo "them and the reader, which lives in muhammadbayoumi/mbiXsite."
            exit 1
          fi

          echo ""
          echo "Both pages read what this job just published:"
          echo "  $SITE/scrapex-privacy.html"
          echo "  $SITE/scrapex-support.html"
