<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data — ScrapeX</title>
<!--
  THE DATA PAGE. An extension page, opened in a TAB. Plan B2.

  Not a view in the panel: this is the widest surface in the product — forty-odd
  columns of one source — and the panel is 360px. Not a page on the engine's web
  UI any more either, which is the whole point of the migration: the engine
  keeps fetching and writing SQLite, and everything anyone LOOKS at lives here.

  IT RUNS THE ENGINE'S OWN GRID (#1198). grid.js, grid-theme.css, table-theme.css,
  data-workspace.css and ui.js are generated copies of the design/ files the
  engine's /source/<key> page runs, written here by tools/sync_design_assets.py.
  So the table here is that page's table, for a price source and a dataset alike.
  The frame below is source.html's grid frame, written without its template: the
  ids are the ones grid.js looks up, and data.js fills the source's name in.

  THE ENGINE IS STILL INVOLVED. The rows come from `GET /api/table/{source_key}`
  over 127.0.0.1, because nothing else can read the local database yet.

  THE GRID'S LIBRARIES ARE VENDORED. MV3 will not load a script from anywhere
  but the extension, so TanStack Table and TanStack Virtual ship in
  vendor/tanstack/ — the same bytes the engine serves, held identical by
  tests/test_vendor.py. datagrid.js imports them, and grid.js imports datagrid.js.
  A CDN would break the offline promise and hand a third party the ability to
  change what runs on the owner's machine.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="data.css">
<link rel="stylesheet" href="table-theme.css">
<link rel="stylesheet" href="grid-theme.css">
<link rel="stylesheet" href="data-workspace.css">
</head>
<body>

<div class="data-workspace">
  <section class="data-view" aria-label="Selected dataset">

    <!-- Above the frame, and red: where he looks when the page cannot run at all. -->
    <p id="data-blocked" class="hint err hidden" role="status" aria-live="polite"></p>

    <section id="data-frame" class="data-grid-frame" aria-label="Dataset grid">
      <header class="data-grid-frame-head">
        <div class="data-grid-heading">
          <span class="data-grid-eyebrow">Dataset table</span>
          <!-- The source's key, not the engine page's "Latest price per offer",
               which is false for a dataset. -->
          <h2 id="data-source">Data</h2>
          <p>Arrange columns, group rows, and inspect records without changing the source data.</p>
          <!-- THE STATUS LINE: what the activity filter is doing, then what it left. -->
          <p class="hint" id="data-summary" role="status" aria-live="polite"></p>
        </div>
      </header>

      <!-- THE ACTIVITY FILTER. Issue 543: 398,933 memberships over 17,811 contractors,
           stored since August and readable from nowhere. HIDDEN UNTIL THE ENGINE SAYS THIS
           DATASET HAS A VOCABULARY -- a control that cannot work is worse than no control,
           and a price source has none of this. -->
      <section id="data-activities" class="data-activities hidden">
        <div class="row data-activities-head">
          <button id="data-activities-toggle" class="button ghost" type="button"
                  aria-expanded="false" aria-controls="data-activities-tree">Activities</button>
          <label class="data-activities-mode" for="data-activities-mode">
            <select id="data-activities-mode">
              <option value="any" selected>Any of the chosen</option>
              <option value="all">All of the chosen</option>
            </select>
            <span class="hint" id="data-activities-mode-label"></span>
          </label>
          <button id="data-activities-clear" class="button ghost" type="button" hidden>Clear</button>
        </div>
        <!-- A STATE, NOT A CATEGORY -- his ruling. 9,001 contractors carry the site&rsquo;s
             own "No Data" node, which is larger than its largest real category. -->
        <p class="hint" id="data-undeclared"></p>
        <div id="data-activities-tree" class="data-activities-tree hidden"></div>
      </section>

      <div class="data-grid-commandbar">
        <!-- Native details keeps the popup keyboard-operable without a custom menu widget. -->
        <details id="grid-features">
          <summary class="data-grid-command">
            <svg class="sx-icon" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-settings"></use></svg>
            <span>Grid Features</span>
          </summary>
          <div class="grid-feature-popover">
            <header><strong>Grid Features</strong><span id="data-features-scope">Saved for this source</span></header>
            <div class="featuregrid" role="group" aria-label="Available grid features">
              <span class="grid-feature-section">Available now</span>
              <label><input type="checkbox" checked disabled> Column Resizing
                <small>Always on</small></label>
              <label><input type="checkbox" data-feature="tree"> Row Grouping</label>
              <label><input type="checkbox" data-feature="rows"> Nested Rows</label>
              <label><input type="checkbox" data-feature="select"> Row Selection</label>
              <label><input type="checkbox" data-feature="rownum"> Row Numbers</label>
              <label><input type="checkbox" data-feature="totals"> Column Totals</label>
              <label><input type="checkbox" data-feature="compact"> Compact Rows</label>
              <label><input type="checkbox" data-feature="wrap"> Wrap Long Text</label>
              <label><input type="checkbox" data-feature="stripe"> Striped Rows</label>
              <label><input type="checkbox" data-feature="statusbar"> Status Bar
                <small>Show row and selection totals</small></label>

              <span class="grid-feature-section">Planned</span>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Advanced Filter <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Cell Selection Header Highlight <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Column Groups <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Column Hover <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Columns Tool Panel <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Floating Filters <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Pagination <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Right To Left <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Row Drag <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Row Pinning <small>Planned</small></label>
              <label class="is-planned" title="Planned — not available yet"><input type="checkbox" disabled> Show Integrated Chart Popup <small>Planned</small></label>
            </div>
          </div>
        </details>
        <!-- A door to Choose Columns that is not inside the columns: untick every
             column and there are no headers left to open the chooser from. -->
        <button type="button" id="grid-columns-button" class="data-grid-command">
          <svg class="sx-icon" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-view-column"></use></svg>
          <span>Columns</span>
        </button>
        <!-- Asks the engine again, in place: the rows stay, dimmed, until the answer. -->
        <button type="button" id="data-reload" class="data-grid-command">
          <svg class="sx-icon" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-sync"></use></svg>
          <span>Reload</span>
        </button>
      </div>
      <p id="grid-chips" class="answer"></p>
      <div class="data-grid-viewport" data-grid-viewport>
        <!-- No data-source here: data.js sets it before it starts the grid. -->
        <div id="grid" class="tablewrap"></div>
      </div>
      <footer class="data-grid-exportbar">
        <!-- Two different exports: CSV and JSON are the view on screen, Excel is the
             engine's whole record of the source. -->
        <div class="data-grid-export-copy">
          <strong>Export data</strong>
          <span>Excel includes the complete record. CSV and JSON follow the
                current table view.</span>
        </div>
        <div id="grid-toolbar" class="toolbar" aria-label="Export">
          <div class="split-button" role="group" aria-label="Export data">
            <button type="button" class="split-button-primary" data-split-action="xlsx"
                    aria-label="Export complete record as an Excel workbook"
                    title="Export complete record as an Excel workbook">
              <svg class="sx-icon" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-file-download"></use></svg>
              <span>Excel workbook</span>
            </button>
            <details class="split-button-menu">
              <summary class="split-button-trigger" aria-haspopup="menu"
                       aria-expanded="false" aria-label="Other export formats"
                       title="Other export formats">
                <svg class="sx-icon split-button-chevron" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-expand-more"></use></svg>
              </summary>
              <div class="split-button-options" role="menu" aria-label="Export format">
                <button type="button" class="split-button-option" data-split-action="csv"
                        role="menuitem">
                  <span class="split-button-option-icon">
                    <svg class="sx-icon" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-description"></use></svg>
                  </span>
                  <span class="split-button-option-copy">
                    <strong>CSV table</strong>
                  </span>
                  <span class="split-button-option-tag">.csv</span>
                </button>
                <button type="button" class="split-button-option" data-split-action="json"
                        role="menuitem">
                  <span class="split-button-option-icon">
                    <svg class="sx-icon" aria-hidden="true" focusable="false"><use href="icons/material-icons.svg#material-insert-drive-file"></use></svg>
                  </span>
                  <span class="split-button-option-copy">
                    <strong>JSON data</strong>
                  </span>
                  <span class="split-button-option-tag">.json</span>
                </button>
              </div>
            </details>
          </div>
        </div>
      </footer>
    </section>
    <p id="grid-note" class="hint" role="status" aria-live="polite">Loading the table…</p>

    <!-- The record panel opens HERE, under the table, so choosing a row never
         navigates away from the filtered view that found it. -->
    <section id="offer-panel" hidden aria-label="Selected record details"
             tabindex="-1"></section>

  </section>
</div>

<!-- appearance.js FIRST, and as a classic script. It is what puts `data-theme`
     on the document, and a module would run after the first paint — the
     onboarding incident, recorded at onboarding.html:73-75.
     Then what grid.js reads when it starts, in the engine page's order: the time
     zone (the record panel's dates), the icons, the split button. The grid's
     renderer and its libraries are modules grid.js imports itself.
     grid.js itself is not a tag: data.js adds it once it has set the host. -->
<script src="appearance.js"></script>
<script src="timezone.js"></script>
<script src="ui.js" data-icon-sprite="icons/material-icons.svg"></script>
<script src="split-button.js"></script>
<script type="module" src="data.js"></script>
</body>
</html>
