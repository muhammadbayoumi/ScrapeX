# ============================================================================
# ScrapeX Manifest — the extraction CONTRACT for every source.
# Owner principle: "له أساس ليس جمعاً عشوائياً" — nothing is collected that is
# not declared here; the ingest scope guard rejects out-of-contract rows.
#
# Sources start active: false. Each is activated ONLY when its connector lands
# with tests (ENGINEERING.md T1/T2); the owner flips the flag from the panel's
# Auto switch (or here). active gates SCHEDULED runs only — manual runs from
# the panel always work.
#
# A source is named twice: source_name in English, REQUIRED because English is
# the primary display language, and source_name_ar for the same site as it
# names itself in Arabic. Each name states the language it holds. A name is a
# fact about the source, not a scraped value, so it is stated here — the
# dataset lists and the page headings then read in both languages, as the table
# already does.
# Validation: scrapex validate-manifest (same check runs in CI — S5).
# ============================================================================

sources:
  # ---- probed 2026-07-16: Magento 2 + Hyvä; GraphQL open; SSR fallback ----
  - source_key: MADAR
    source_name_ar: المدار
    source_name: Madar
    base_url: https://www.madar.com
    family: magento-graphql
    cadence: daily
    authority: shop
    active: false
    currency: SAR
    default_region: SA
    # PRICE SEMANTICS — settled per PRODUCT SHAPE, and settled by the OWNER's
    # rule for what to DO about it: «سجلها كما تاخذ البيانات من الموقع بدون
    # تعديل ولكن عمود الضريبة يكون واضح الرقم دا شامل الضريبة ام لا» — store
    # what the site gives, unmodified, and let the tax column say whether that
    # number includes tax. Nothing here is multiplied by anything.
    #
    #   shape                count   what GraphQL answers      stored as
    #   SimpleProduct          399   the printed price          vat_included=1
    #   GroupedProduct          33   no group price at all —    vat_included=1
    #                                one row per MEMBER, and    (per member)
    #                                the members match 28/28
    #   ConfigurableProduct    328   the shop's own basePrice   vat_included=0
    #
    # The configurable gap is not a ratio guess, and it was re-checked live on
    # 2026-07-25 by a second pass that fetched the pages itself. 12512-TSP:
    # GraphQL answers 50.4, and the page publishes
    #   "prices":{"baseOldPrice":{"amount":50.4},"oldPrice":{"amount":57.96},
    #             "basePrice":{"amount":50.4},"finalPrice":{"amount":57.96}}
    # with «initialFinalPrice: 57.96» — beside its own declarations
    # «finalPriceExclTaxKey = 'basePrice'» and «finalPriceInclTaxKey =
    # 'finalPrice'». The shop names which of its two figures excludes tax, and
    # the API hands us that one. The control: SimpleProduct 71231005 answers
    # 65.21 in the API against «initialFinalPrice: 65.205» on its page — no gap.
    #
    # Which also explains the history. On 2026-07-23 a source-WIDE 15% uplift
    # was added because the Legrand floor box read 194.9 in the API and 224.14
    # on the page. 60402-LPF is a CONFIGURABLE and still answers 194.9 — that
    # reading was right for its shape. On 2026-07-25 the uplift was removed
    # because putty-1-kg-sab and uib-oxidized-bitumen showed no gap at all;
    # both are SIMPLE, and that reading was right for THEIRS. Both observations
    # were true. What was wrong, twice, was answering with arithmetic: the
    # uplift put 3,312 prices in the warehouse that no madar page has ever
    # printed. A stored price now always exists on the site, and the fact that
    # a configurable one is quoted before tax rides the row instead of being
    # baked into the number.
    #
    # A SEPARATE figure the page also shows: «حساب أعمال؟ افتح السعر: 4.03» is
    # the business-account price, which an anonymous crawl can never be charged
    # (the same shape as sika's trade tier). We store the visitor price and
    # never that one.
    vat_mode: incl
    api:
      # A statement of fact about ONE shape, not an instruction to convert. It
      # makes those 328 rows carry vat_included=0, so the Tax column reads
      # "Excl. 15%" on them and "Incl. 15%" on the simple rows beside them.
      configurable_prices_exclude_tax: true
    tax:
      # The rate for that label, with the sentence it was read from — every
      # madar product page carries this line under the price. 12512-TSP is the
      # URL because it is the product whose two LABELLED figures (basePrice
      # 50.4 excl, finalPrice 57.96 incl) are what makes the 15 a reading
      # rather than an assumption.
      - region: SA
        vat_mode: incl
        evidence: stated
        rate_pct: 15
        statement_text: >-
          الأسعار تشمل ضريبة القيمة المضافة 15%.
        statement_url: https://www.madar.com/12512-tsp.html
        statement_lang: ar
        verified_at: "2026-07-25"
    extract:
      - kind: product_prices
        scope: census          # first crawl is a full census; owner will replace
                               # with targeted categories after apply-decisions
      # The «المزيد من المعلومات» panel — manufacturer, country of manufacture,
      # origin, size, material type, coating, grade — arrives in the SAME
      # census response via custom_attributesV2 (verified live 2026-07-23).
      # The connector could read it all along; nothing asked for it.
      - kind: enrichment
        scope: census
    # WHAT ONE OF THESE IS. Two shapes, because madar states it two ways and
    # neither is the shape sikaegshop uses.
    #
    # Measured 2026-08-03 over all 3,537 offers: 3,480 resolve from the
    # platform's declared weight+weight_unit, 52 from an option value that
    # names a container, 5 stay silent. Today 92 carry a unit, all kg.
    unit_charter:
      version: 1
      witnesses:
        # 1. The shop naming a CONTAINER and what is in it: «4 كجم/صندوق»,
        #    "1000 Pcs/Box". First, because it is richer — it says what the
        #    thing IS, where the weight below says only how much of it there is.
        #    18 offers are stored today as kg-with-basis-3-or-4 while the shop's
        #    own published option says BOX; that is this warehouse overwriting
        #    what the shop said.
        - {field: variant_axes_ar, lang: ar, provenance: stated_field, shape: container}
        - {field: variant_axes,    lang: en, provenance: stated_field, shape: container}
        # THERE IS NO SECOND WITNESS, AND THAT IS THE FINDING.
        #
        # The first draft of this charter had one: weight + storeConfig's
        # weight_unit, which would have resolved 3,480 of the 3,537 offers. It
        # was justified with three steel products at 368.4, 1000 and 2052 kg
        # pricing out at 3.36, 3.47 and 3.26 SAR/kg — a tight band a shipping
        # figure would not produce.
        #
        # Six rows, all steel. Testing the claim properly killed it. Across all
        # 6,764 observations price/weight has a median of 3.46 and a 99th
        # percentile of 1,253, with a maximum of 38,923. Within single products:
        # Steel Square Tube runs 2.81 to 374.72, Corrugated Sheet 0.47 to 7.64.
        # A price of 38,923 "per kg" is not a price per kg. So `weight` is the
        # quoting basis for some products and a piece mass for others, exactly
        # as magento.py says in writing — "this connector does not decide
        # whether 1000 is a basis or a mass" — and exactly as the owner ruled on
        # 2026-07-29: «الحقائق الخام فقط», the unit column stays empty where the
        # shop states no unit for THAT product.
        #
        # A store-wide weight_unit is the shop saying "my weight numbers are in
        # kg". It is not the shop saying what one of THIS product is.
        #
        # 3./4. THE SAME TWO FIELDS, READ AS A PLAIN QUANTITY. «المقاس: 3.25 Kg»
        #    is the shop stating what one of these is, in the same option value
        #    the container witness above reads — it simply names a weight
        #    instead of a box. Ranked BELOW the containers so «4 كجم/صندوق»
        #    still resolves as a box: measured over all 3,550 active offers,
        #    these two witnesses alter ZERO container readings.
        #
        #    This is what a full rebuild could never fix, and I recorded the
        #    opposite in 0060. The owner ran one on 2026-08-04; all 74
        #    unwitnessed readings came back identical, because re-fetching
        #    cannot teach a charter to look at a field it was never pointed at.
        #
        #    Measured on the live warehouse before writing this: 55 legacy rows
        #    gain a witness WITHOUT ANY NUMBER CHANGING — the axis says 3.25 Kg
        #    and the row already said 3.25 kg, it just could not say who told
        #    it. 32 more offers carry no unit at all today (basis 1.0, unit
        #    NULL) and gain one the shop states, e.g. «Size: 320 g». Zero rows
        #    with a stored unit are contradicted.
        #
        #    TWO SEPARATE DEFENCES STOP THIS BEING A DISASTER, and I first
        #    wrote that only one did. These option values also carry «amperage:
        #    20A» (54 of them), «gangs: 1 Gang» (190), «Poles: 1P», «Feature:
        #    2BB», «Size: 8 In» and «Size: 20 mm», and a rule that read "a
        #    number then a word" would announce that one of these is twenty
        #    amperes.
        #
        #      - A, Gang, P, BB, In are refused by units.py's UNIT_WORDS: they
        #        are not measurements at all, and no charter can admit them.
        #        Adding "a" to the pack below changes nothing — verified.
        #      - mm and cm ARE real measurements and are refused by the pack
        #        list, which says which measurements can be a SELLING unit
        #        here. This is the line that would break if someone widened it.
        #
        #    «Size: 1 Ton» does resolve, to one tonne, because tonne is on the
        #    pack list and a tonne of steel is a thing this shop sells.
        - {field: variant_axes_ar, lang: ar, provenance: stated_field, shape: quantity}
        - {field: variant_axes,    lang: en, provenance: stated_field, shape: quantity}
        #
        # 5. THE SIZE THE SHOP STATES IN ITS SPECIFICATIONS, ranked last of all.
        #    «إسمنت السعودية» carries no size on its variants — its option value
        #    is «Cement Type: Sulphate Resistant» — and states «المقاس: 50 Kg»
        #    in its Specifications panel, which is the shop saying what one bag
        #    is. 48 madar products state a mass or volume that way.
        #
        #    LAST BECAUSE IT DESCRIBES THE FAMILY, not the member. A product
        #    with variants that differ in size states the family's figure here,
        #    and printing it on each member is the exact mistake reports.py
        #    names in writing about product-level attributes. Nine of the 48
        #    have more than one variant, so the ordering is load-bearing rather
        #    than theoretical: the variant's own axis answers first wherever it
        #    speaks, and this is heard only where the variant is silent.
        #
        #    Measured over all 3,550 active offers before it was added:
        #      13 agree with what is stored, changing no number
        #      53 carry no unit today and gain the one the shop states
        #       2 CONTRADICT — stored 25 kg where the shop's own panel says
        #         «20 Kg», both provenance legacy_unwitnessed, both written by
        #         code that could not name a field. The charter answers 20, and
        #         the retirement rule below is what stops the 25 standing
        #         beside it.
        - {field: spec_size, lang: und, provenance: stated_field, shape: quantity}
      # The site writes the SAME container in two languages, and this maps both
      # to one code. Measured: without it «صندوق» (16) and "box" (24) become two
      # different selling units for one shop's box, and two prices for the same
      # product stop being comparable. It does NOT reject sizes like 1-1/2" —
      # the reader requires letters on both sides of the slash and never sees
      # them. I wrote the opposite here first; the measurement corrected it.
      containers:
        box:  [box, صندوق]
        roll: [roll, لفة]
        bag:  [bag, كيس]
        drum: [drum, درم]
      scales:
        pack: [kg, gm, ml, liter, m, tonne, piece]
    min_expected_rows: 50
    max_drop_pct: 50
    notes: >
      Stores en_SA + ar_SA (ar gives Arabic names free). 760 products in three
      shapes, all three recorded, each at the figure the API states — see the
      per-shape price semantics above for which of them is quoted before tax.
      A grouped product yields ONE ROW PER MEMBER, because its page has no
      product price: it lists the members and prices each. Business-segment
      prices and per-branch availability need a session (extension capture,
      Phase 4).

  # ---- probed: Salla; SSR + JSON-LD; numeric /p{ID} ids. This is "السويد" ----
  - source_key: ALSWEED
    source_name_ar: السويد
    source_name: Alsweed
    base_url: https://alsweed.sa
    family: salla-html
    cadence: daily
    authority: shop
    active: true
    currency: SAR
    default_region: SA
    vat_mode: incl
    extract:
      - kind: product_prices
        scope: census
      # The salla connector has read the JSON-LD `image` since it was written
      # (salla.py enrichment_rows), but only builds those rows when the source
      # DECLARES enrichment — and this one never did, so 1,203 products landed
      # with no picture while every page published one (15/15 sampled live
      # 2026-07-30). The pictures ride the page the price already paid for.
      - kind: enrichment
        scope: census
    min_expected_rows: 50
    max_drop_pct: 50
    notes: >
      Variant-priced products expose offers.price=0 in JSON-LD — variant prices
      need the Salla options XHR or an extension capture. Crawl canonical slug
      URLs from the ar sitemap (short /-/p{id} URLs redirect-loop).

  - source_key: ELBUROJ
    source_name_ar: البروج
    source_name: Elburoj
    base_url: https://elburoj.com
    family: salla-html
    cadence: daily
    authority: shop
    active: false
    currency: SAR
    default_region: SA
    vat_mode: incl
    extract:
      - kind: product_prices
        scope: census
      # The SAME one-line gap ALSWEED had, and the reason a per-source fix is
      # the wrong shape for a family: salla.py has always read the JSON-LD
      # image, but only builds those rows when the source declares enrichment,
      # and ingest refuses the payload otherwise. Verified on the captured page
      # tests/fixtures/live/salla_elburoj_product_priced_p543555922.html —
      # elburoj publishes a cdn.salla.sa image, exactly as alsweed does. No
      # request was made to elburoj to establish this; a full crawl of it was
      # running at the time and the fixture already answered the question.
      #
      # The pictures ride the product page the price already paid for, so this
      # adds ZERO requests to a source that asks for a 10-second crawl delay.
      - kind: enrichment
        scope: census
    min_expected_rows: 20
    max_drop_pct: 50
    notes: robots crawl-delay 10s — honored by the politeness budget (F5).

  # ---- probed: Zid platform; SSR + JSON-LD; UUID ids; needs browser UA ----
  - source_key: ADVANCEDCASTLE
    source_name_ar: القلعة المتقدمة
    source_name: Advanced Castle
    base_url: https://advancedcastle.com
    family: zid-html
    cadence: daily
    authority: shop
    active: true
    currency: SAR
    default_region: SA
    vat_mode: incl
    user_agent: >-
      Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36
    extract:
      - kind: product_prices
        scope: census
      # The images the owner reported missing. The product JSON-LD this crawl
      # already reads for the price carries `image` on every product, but
      # ingest REFUSES an enrichment payload from a source that does not
      # contract enrichment — so the connector's new branch alone would have
      # changed nothing. Both links, or neither.
      - kind: enrichment
        scope: census
    min_expected_rows: 20
    max_drop_pct: 50
    notes: >
      403 for non-browser user agents — the source declares a Chrome user_agent
      the fetcher sends. Variant prices are in the page HTML, not JSON-LD (v1
      records the product-level JSON-LD price only).

      NO IMAGES WERE STORED until 2026-07-29, and the cause was not this store:
      168 of 168 products were crawled and 0 carried an image, because nothing
      asked for any. The zid connector had no enrichment branch, and this
      source contracted no enrichment extract. Both are fixed together. The
      pictures cost no extra request — they are in the same Product JSON-LD as
      the price. MEASURED before/after, live: 0/168 products with an image,
      then (this connector, one crawl, after the fix) 168/168 with at least
      one image, 435 image rows, 771 enrichment rows total. A separate
      42-product sample found the page's own gallery markup names 124 images
      against JSON-LD's 109 for the same products, with every JSON-LD image
      among them — so 15 of 124 stay unread; reading the gallery too is a
      separate call for the owner, not a silent widening of this fix.

      BILINGUAL + TWO COUNTRIES, established live 2026-07-28. Every page's own
      <head> publishes five alternates: ar-sa (unprefixed, x-default), en
      (/en/...), ar-eg (/ar-eg/...) and en-eg (/en-eg/...). The two dimensions
      are ORTHOGONAL on the five products probed: language changes the text
      only ("طفاية حريق ثاني أكسيد الكربون CO2 سعة 6 كجم" / "6kg CO₂ Fire
      Extinguisher", "أنظمة الإطفاء > طفايات الحريق اليدوية" / "Extinguish
      Systems > Manual fire extinguishers"), country changes the money only
      (SAR 285.00 / EGP 3353.92). The sku is identical across all four
      (e1mf0901), so they are one product, not four. The connector now reads
      the English alternate and fills product_name/category_path from it.

      THE EGYPTIAN PRICE IS NOT CRAWLED, deliberately. It is a CONVERSION, not
      a price the merchant set: across five products the EGP/SAR ratio is
      constant at 11.768 (11.7681, 11.7679, 11.7697, 11.7684, 11.7680), and the
      store publishes its own rates in-page — SAR "exchange_rate": "3.747989",
      EGP "exchange_rate": "50.7221". Recording it as an ordinary price would
      put a derived number in the same column as a published one, which is the
      mistake price_basis exists to prevent — and price_basis/original_price
      live on COMMODITY_PRICE, not PRODUCT_PRICES. Adding them is a schema
      migration and therefore an owner decision. Note the warehouse would keep
      the two countries apart correctly if it were captured: source_offer is
      keyed on country_code_alpha2 and the price key carries region+currency.

      OWNER-CONFIRMED 2026-07-30. Asked directly, with the sharper fact that
      the store's TWO published rates (SAR 3.754116, EGP 50.5485 per USD —
      captured 2026-07-29 by _rates_abroad) imply a ratio of 13.46 while its
      Egyptian pages actually price at 11.768: the store does not convert its
      own prices with its own declared rate, so an Egyptian price would be
      neither a merchant price nor a faithful conversion of one. Decision:
      stay Saudi-only and keep publishing the store's Egyptian RATE (already
      shipped, source_kind='shop') rather than crawl a number that is honest
      under neither reading. Not revisited unless the owner raises it again.

  # ---- probed: Shopify; products.json OPEN ----
  - source_key: ELSEWEDYSHOP
    source_name_ar: السويدي شوب
    source_name: Elsewedy Shop
    base_url: https://elsewedyshop.com
    family: shopify-json
    cadence: daily
    authority: shop
    active: true
    currency: EGP
    default_region: EG
    vat_mode: incl
    extract:
      - kind: product_prices
        scope: census
      # The pictures are in the SAME /products.json the prices come from —
      # 1,442 of them across all 932 products, every product covered (live
      # census 2026-07-30). No extra request.
      - kind: enrichment
        scope: census
    min_expected_rows: 50
    max_drop_pct: 50
    notes: products.json + collections.json open; updated_at drives change detection.

  # ---- probed: SAP Hybris OCC v2 REST open; real EAN/GTIN ----
  - source_key: MASDAR
    source_name_ar: مصدر
    source_name: Masdar
    base_url: https://www.masdaronline.com
    family: hybris-occ
    cadence: daily
    authority: shop
    active: true
    currency: SAR
    default_region: SA
    # CORRECTED 2026-07-20 against the live API: was `excl`, which was backwards.
    # price.value == priceWithTax.value on every product checked; the connector
    # now derives this from the payload and does not depend on this line.
    vat_mode: incl
    api:
      base_url: https://api.masdaronline.com   # data host != storefront base_url
      base_site: masdar                        # CONFIRMED live 2026-07-20
    tax:
      # Not a claim: the API returns both figures, so the rate is read off the
      # source rather than asserted. 180.00 excl -> 206.99999999999997 incl = 15%.
      - region: SA
        vat_mode: incl
        evidence: stated
        rate_pct: 15
        statement_text: >-
          The OCC search response publishes priceWithoutTax and priceWithTax for
          every product; price equals priceWithTax, and their ratio is 1.15.
        statement_url: https://api.masdaronline.com/rest/v2/masdar/products/search?fields=FULL
        statement_lang: en
        verified_at: "2026-07-20"
    extract:
      - kind: product_prices
        scope: census
      # The pictures are in the SAME fields=FULL search response the prices
      # come from: 560 of the 640 priced products carry one, published at
      # three rendering sizes (live census 2026-07-30). The other 80 publish
      # none, and stay honestly blank.
      - kind: enrichment
        scope: census
    min_expected_rows: 200
    max_drop_pct: 50
    notes: >
      1354 SKUs via api.masdaronline.com/rest/v2/{base_site}/products/search
      (confirmed live 2026-07-20). A FULL search response already carries price,
      priceWithTax and priceWithoutTax — no per-product detail call is needed for
      any of them.

  # ---- probed: custom Next.js shop with open unauthenticated JSON API ----
  - source_key: SIKAEGSHOP
    # Single-brand shop: the pages never print a brand because on this
    # site it is not information. Stated once, applied only where the
    # connector found nothing.
    brand: SIKA
    source_name_ar: سيكا مصر شوب
    source_name: Sika Egypt Shop
    base_url: https://www.sikaegshop.com
    family: custom-json-api
    cadence: daily
    authority: shop
    active: false
    currency: EGP
    default_region: EG
    # CORRECTED 2026-07-23 (owner's cart check): the listed price is NET —
    # adding a product and opening the cart adds 14% VAT. The listing is what
    # we store, and this says what it is rather than claiming it includes a
    # tax it does not.
    vat_mode: excl
    tax:
      - region: EG
        vat_mode: excl
        evidence: stated
        rate_pct: 14
        statement_text: >-
          The listed price is net; the cart adds 14% VAT at checkout
          (owner-verified in the shop's own cart, 2026-07-23).
        statement_url: https://www.sikaegshop.com/cart
        statement_lang: ar
        verified_at: "2026-07-23"
    extract:
      - kind: product_prices
        scope: census
      # COSTS 87 EXTRA REQUESTS — one per product, and it is worth them.
      #
      # This line used to say "no extra request", which was true of the LIST
      # endpoint alone: short descriptions, keywords and weights do ride the
      # responses the prices come from. But the list publishes ONE attachment of
      # eleven, no attributes, no full description and no sku at all — so the
      # panel showed one picture of nine and every row's SKU was empty.
      # /api/products/{id} carries all of it and nothing cheaper does. A full
      # crawl is 8 requests without this line and 95 with it, about a minute and
      # a half at the fetcher's 1 req/s.
      #
      # A shop an order of magnitude larger would need this reconsidered. The
      # sentence is here so that decision is made with the price in front of it.
      - kind: enrichment
        scope: census
    # WHAT ONE OF THESE IS. Owner ruling 2026-08-02, after he checked the
    # site himself: on THIS shop the product name settles every conflict —
    # «اسم المنتج يحسم كل شى بالنسبة لموقع سيكا (قاعدة لا تعمم)». Written
    # here, under this source, because it is a fact about this shop and not
    # a law about shops.
    #
    # It matters because the shop states a weight TWICE and the two disagree
    # on 14 of the 76 products carrying both: an authored Specifications row
    # («الوزن» / "weight") and the platform's own numeric `weight` field. On
    # product 261 the page shows 1 and 20. The name says 20 KG, so 20 it is.
    unit_charter:
      version: 1
      witnesses:
        - {field: product_name,    lang: en, provenance: stated_in_name}
        - {field: product_name_ar, lang: ar, provenance: stated_in_name}
        - {field: attr_3,          lang: en, provenance: stated_field}
        - {field: attr_3_ar,       lang: ar, provenance: stated_field}
        - {field: attr_1,          lang: en, provenance: stated_in_prose}
        - {field: attr_1_ar,       lang: ar, provenance: stated_in_prose}
      corroborators:
        # The platform's field. It may agree; it may never originate. It does
        # not name its own unit — the "kg" was written in OUR code.
        - {field: weight}
      scales:
        # Only these can be a SELLING unit here. That allow-list is what
        # stops «سيكا باكينج رود 1 سم» becoming a one-centimetre unit — cm
        # is simply not a candidate — and the word boundary in units.py is
        # what stops the m in "18mm" being read as a metre. Measured over
        # all 87: declaring a separate `dimension` list changed ZERO
        # answers, so it is not declared. A rule that carries nothing reads
        # like a guarantee and is not one.
        pack: [kg, gm, ml, liter, m]
    min_expected_rows: 30
    max_drop_pct: 50
    notes: >
      /api/products (87 products, ar/en names). PRICE SEMANTICS SETTLED
      2026-07-23 from the storefront's own JS bundle plus a live browser check,
      so the "needs one manual verification" caveat is discharged: `price` is
      the public price and what we record; `specail_price` (78/87) is a
      TRADE-TIER price the shop charges only to a logged-in customer whose
      customerTypeId is 2 — anonymous and customerTypeId 1 both render `price`
      — so it is carried as enrichment, never as a discount; `flash_sale_price`
      is a nullable NUMBER (not a boolean) that binds every visitor when
      positive, and is null on all 87 today. There is no date window and no
      activation flag: no settings/config/flash-sale endpoint exists and
      created_at/updated_at are empty objects.

  # ---- probed 2026-07-28/29: bespoke ASP.NET Web API on a SECOND host ----
  - source_key: HEIDELBERG_EG
    source_name_ar: متجر هايدلبرج ماتيريالز الالكتروني
    source_name: Heidelberg Materials Egypt Online Store
    base_url: https://onlinestore.heidelbergmaterials.eg
    family: heidelberg-price-matrix
    cadence: daily
    # The cement PRODUCER's own storefront, not a reseller's — but what it
    # publishes is a shop's listed price, so it is filed as one. Raising it to
    # `official` is the owner's call, not a connector author's: authority
    # decides which source wins at publish.
    authority: shop
    active: false
    currency: EGP
    default_region: EG
    api:
      # The data host. The storefront is Angular served as static files from
      # IIS and answers 404 to every API path; the bundle hard-codes
      # APIUrl="https://onlinestoreapi.heidelbergmaterials.eg/api". Without
      # this line the connector refuses to run rather than guess a host.
      base_url: https://onlinestoreapi.heidelbergmaterials.eg
    taxonomy:
      # A THIRD host, and the only place the company publishes a real product
      # taxonomy. The store API's own `productTypes` has two values, `Bagged`
      # and `Bulk`, and all 9 catalogued products are `Bagged` — a packaging
      # type that distinguishes nothing, which is what used to fill
      # category_path. The corporate site publishes 5 cement families in both
      # languages instead.
      #
      # It has its own robots.txt (the two store hosts serve none): 200, the
      # Drupal default, whose `Crawl-delay: 10` is addressed only to AhrefsBot
      # and AhrefsSiteAudit — the `*` group carries none, so nothing in it
      # binds this crawler, and no Disallow intersects either path below.
      base_url: https://www.heidelbergmaterials.eg
      # Both stated, neither derived: the site's Arabic and English aliases for
      # this one page share no stem, so building one from the other would be a
      # guess. Each is what the other's `<link rel="alternate" hreflang>`
      # declares, and the captured fixtures assert the pairing.
      listing_path: /en/our-products
      listing_path_ar: /ar/our_products_ar
    vat_mode: incl
    tax:
      # CORRECTS the recon report, which read the site as making no VAT claim
      # about the per-tonne price. It makes one, transitively and clearly: the
      # cart computes `total = listedPrice × tonnes` with NO tax arithmetic
      # anywhere in the 719,821-byte bundle, and this sentence renders directly
      # beneath that total in the cart, the checkout and the order details. A
      # total that is inclusive and is the listed price times a quantity means
      # the listed price is inclusive too.
      #
      # statement_url is the BUNDLE, deliberately. The sentence renders on
      # /cart, /checkout and the order page, and all three answer 404 to a
      # direct GET because the SPA has no fallback rewrite (checked
      # 2026-07-29) — so the bundle is the only address at which a person can
      # actually read it. Its filename is content-hashed and WILL change when
      # they redeploy; the sentence is what to search for then.
      - region: EG
        vat_mode: incl
        evidence: stated
        rate_pct: 14
        statement_text: >-
          شامل النقل و ضريبة القيمة المضافة (14%)
        statement_url: https://onlinestore.heidelbergmaterials.eg/main-4XHUPALI.js
        statement_lang: ar
        verified_at: "2026-07-29"
    extract:
      - kind: product_prices
        scope: census
      # NO EXTRA REQUEST. The four technical blocks, the two short descriptions
      # and the manufacturer all ride the same /api/Products response the
      # prices are joined against — and they are the only technical data this
      # source has. It publishes no datasheets at all: the bundle names nine
      # Azure blob containers and not one of them is for documents.
      - kind: enrichment
        scope: census
    # 108 published prices today. A filter defect would take that to 0 or to
    # 18, both of which this catches; a genuine withdrawal (a governorate
    # going quiet) costs roughly 12 rows, which it tolerates.
    min_expected_rows: 60
    max_drop_pct: 40
    notes: >
      THREE REQUESTS AND ~16 SECONDS FOR THE WHOLE SOURCE. /api/Products (9
      products), /api/Plants (3 rows) and /api/ProductsPrices — the entire
      price matrix in one 19 MB body, 5.4 MB gzipped, no pagination, no
      sitemap, no products.json, no GraphQL, all anonymous. /api/Plants is the
      third because a multi-plant product is quoted from Y220 and NO product is
      assigned to Y220, so «القطامية» / "Katameya" is in no other payload; one
      request buys the site's own word for it in both languages instead of a
      transliteration of ours.

      WHAT A PRICE IS. Product × governorate × dispatch plant × quantity tier ×
      customer segment: 2,070 rows × 12 price columns = 24,840 slots, of which
      211 hold a number and 108 are prices the storefront can render. The three
      filters that cut 211 to 108 are all read off the site's own code, never
      chosen by us — segment Y6 (the value the anonymous storefront hard-codes;
      the other 10 prices are YM/YT and all for Dahab, a city the API flags
      inactive), the row's own isActive (the storefront's own city endpoint
      filters these, and dropping them is what stops the two endpoints
      disagreeing), and the plant rule (isMultiPlant=false renders only the
      product's own plantCode, isMultiPlant=true renders a two-option dropdown
      of Y210 and Y220 with no Y410 branch at all). One row per published
      (product, city, plant, tier), keyed on cityId|plantCode|sapCode — three
      identifiers the site publishes, so each of the 108 is its own offer with
      its own timeline rather than one offer appearing to change price 108
      times in a single crawl. No schema migration was needed for any of this.

      0.02 IS NOT A PRICE. The storefront prints «غير متاح» whenever a figure
      is <= 0.1, and every one of the 24,629 non-prices is exactly 0.02 or 0.0
      while every one of the 211 real ones carries a .02 fraction. 0.02 is
      POSITIVE, so the usual "zero means no price" rule lets it through as a
      two-piastre tonne of cement; the connector gates on > 0.1 and cites the
      site's own condition for it.

      maxPrice (1950) AND exWorkMaxPrice (1700) ARE NOT THE PRICE and are not
      recorded. Both ride every product; the bundle references them zero times
      against 65 references to salePrice, and the city matrix prices that same
      product at 3950.02. Recording them would publish a number no page has
      ever printed, at roughly half the real one.

      NO DISCOUNTS EXIST TODAY, so price_before and price_sale stay empty.
      isOnSale is false on all 2,070 price rows and all 12 fakePrice columns
      are sentinels — 0 real values in 24,840 slots. Five of the nine PRODUCTS
      carry isOnSale=true with no fakePrice behind it, which is a flag with
      nothing under it, not a discount to draw.

      PRODUCT IMAGES CANNOT BE CAPTURED BY ANYONE. Image URLs are composed
      against an Azure SAS token baked into the shipped bundle, and it expired
      2026-02-24 — the assets 403 for a normal browser too. That is the site's
      own live defect and no connector work changes it; recorded here so the
      absence is never later read as a bug in ours.

      BILINGUAL, WITH ONE TRAP. Every field is published twice and the
      storefront renders only the Arabic (all 31 components are suffixed -ar,
      there is no language switch), so the English is a free capture. But
      productLabelEn == productLabelAr on all 9 — the same Latin string stored
      twice — and it is a DESIGNATION ("CEMII / A-P 42,5N SUEZ"), not a name:
      it goes to enrichment as cement_type and never into product_name_ar. The
      real pair is productNameEn / productNameAr. The live API returns Arabic
      HTML-entity encoded, so every string is unescaped before it is recorded.
      The quantity axis is Arabic-only on the site and the owner ruled
      2026-07-29 that its English side stays EMPTY rather than be authored.

      NOT PUBLISHED, therefore left empty rather than invented: brand, images,
      datasheets, GTIN, stock, weight, pack size, country of origin,
      variant_url, parent_sku, price_trade. The API has no stock concept at
      all — a tier it prints a price for is one it will sell.

      A product link is a CLIENT-SIDE route (/productinfo/{guid}). A direct GET
      404s at IIS because there is no SPA fallback rewrite. It is recorded for
      a human to open and must never be followed by a crawl.

