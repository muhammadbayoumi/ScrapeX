  # ---- probed: SAP Hybris OCC v2 REST open; real EAN/GTIN ----
  - source_key: MASDAR
    source_name_ar: مصدر
    source_name: Masdar
    base_url: https://www.masdaronline.com
    family: hybris-occ
    cadence: daily
    authority: shop
    active: true
    currency: SAR
    default_region: SA
    # CORRECTED 2026-07-20 against the live API: was `excl`, which was backwards.
    # price.value == priceWithTax.value on every product checked; the connector
    # now derives this from the payload and does not depend on this line.
    vat_mode: incl
    api:
      base_url: https://api.masdaronline.com   # data host != storefront base_url
      base_site: masdar                        # CONFIRMED live 2026-07-20
    tax:
      # Not a claim: the API returns both figures, so the rate is read off the
      # source rather than asserted. 180.00 excl -> 206.99999999999997 incl = 15%.
      - region: SA
        vat_mode: incl
        evidence: stated
        rate_pct: 15
        statement_text: >-
          The OCC search response publishes priceWithoutTax and priceWithTax for
          every product; price equals priceWithTax, and their ratio is 1.15.
        statement_url: https://api.masdaronline.com/rest/v2/masdar/products/search?fields=FULL
        statement_lang: en
        verified_at: "2026-07-20"
    extract:
      - kind: product_prices
        scope: census
    min_expected_rows: 200
    max_drop_pct: 50
    notes: >
      1354 SKUs via api.masdaronline.com/rest/v2/{base_site}/products/search
      (confirmed live 2026-07-20). A FULL search response already carries price,
      priceWithTax and priceWithoutTax — no per-product detail call is needed for
      any of them.

  # ---- probed: custom Next.js shop with open unauthenticated JSON API ----
  - source_key: SIKAEGSHOP
    # Single-brand shop: the pages never print a brand because on this
    # site it is not information. Stated once, applied only where the
    # connector found nothing.
    brand: SIKA
    source_name_ar: سيكا مصر شوب
    source_name: Sika Egypt Shop
    base_url: https://www.sikaegshop.com
    family: custom-json-api
    cadence: daily
    authority: shop
    active: false
    currency: EGP
    default_region: EG
    # CORRECTED 2026-07-23 (owner's cart check): the listed price is NET —
    # adding a product and opening the cart adds 14% VAT. The listing is what
    # we store, and this says what it is rather than claiming it includes a
    # tax it does not.
    vat_mode: excl
    tax:
      - region: EG
        vat_mode: excl
        evidence: stated
        rate_pct: 14
        statement_text: >-
          The listed price is net; the cart adds 14% VAT at checkout
          (owner-verified in the shop's own cart, 2026-07-23).
        statement_url: https://www.sikaegshop.com/cart
        statement_lang: ar
        verified_at: "2026-07-23"
    extract:
      - kind: product_prices
        scope: census
      # COSTS 87 EXTRA REQUESTS — one per product, and it is worth them.
      #
      # This line used to say "no extra request", which was true of the LIST
      # endpoint alone: short descriptions, keywords and weights do ride the
      # responses the prices come from. But the list publishes ONE attachment of
      # eleven, no attributes, no full description and no sku at all — so the
      # panel showed one picture of nine and every row's SKU was empty.
      # /api/products/{id} carries all of it and nothing cheaper does. A full
      # crawl is 8 requests without this line and 95 with it, about a minute and
      # a half at the fetcher's 1 req/s.
      #
      # A shop an order of magnitude larger would need this reconsidered. The
      # sentence is here so that decision is made with the price in front of it.
      - kind: enrichment
        scope: census
    min_expected_rows: 30
    max_drop_pct: 50
    notes: >
      /api/products (87 products, ar/en names). PRICE SEMANTICS SETTLED
      2026-07-23 from the storefront's own JS bundle plus a live browser check,
      so the "needs one manual verification" caveat is discharged: `price` is
      the public price and what we record; `specail_price` (78/87) is a
      TRADE-TIER price the shop charges only to a logged-in customer whose
      customerTypeId is 2 — anonymous and customerTypeId 1 both render `price`
      — so it is carried as enrichment, never as a discount; `flash_sale_price`
      is a nullable NUMBER (not a boolean) that binds every visitor when
      positive, and is null on all 87 today. There is no date window and no
      activation flag: no settings/config/flash-sale endpoint exists and
      created_at/updated_at are empty objects.

  # ---- probed: WooCommerce Store API open, variations included ----
  - source_key: SAMEHGABRIEL
    source_name_ar: سامح جبرائيل
    source_name: Sameh Gabriel
    base_url: https://samehgabriel.com
    family: woocommerce-storeapi
    cadence: daily
    authority: shop
    active: true
    currency: EGP
    default_region: EG
    vat_mode: incl
    extract:
      - kind: product_prices
        scope: census
      # The attributes, categories, tags and measurements arrive in the SAME
      # response the price comes from — colours, cable type, length, brand,
      # size, application, voltage type, warranty. Asking for them costs no
      # extra request; not asking threw them away.
