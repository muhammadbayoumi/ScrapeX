# ============================================================================
# ScrapeX Manifest — the extraction CONTRACT for every source.
# Owner principle: "له أساس ليس جمعاً عشوائياً" — nothing is collected that is
# not declared here; the ingest scope guard rejects out-of-contract rows.
#
# Sources start active: false. Each is activated ONLY when its connector lands
# with tests (ENGINEERING.md T1/T2); the owner flips the flag from the panel's
# Auto switch (or here). active gates SCHEDULED runs only — manual runs from
# the panel always work.
#
# A source is named twice: source_name in English, REQUIRED because English is
# the primary display language, and source_name_ar for the same site as it
# names itself in Arabic. Each name states the language it holds. A name is a
# fact about the source, not a scraped value, so it is stated here — the
# dataset lists and the page headings then read in both languages, as the table
# already does.
# Validation: scrapex validate-manifest (same check runs in CI — S5).
# ============================================================================

sources:
  # ---- probed 2026-07-16: Magento 2 + Hyvä; GraphQL open; SSR fallback ----
  - source_key: MADAR
    source_name_ar: المدار
    source_name: Madar
    base_url: https://www.madar.com
    family: magento-graphql
    cadence: daily
    authority: shop
    active: false
    currency: SAR
    default_region: SA
    # PRICE SEMANTICS — settled per PRODUCT SHAPE, and settled by the OWNER's
    # rule for what to DO about it: «سجلها كما تاخذ البيانات من الموقع بدون
    # تعديل ولكن عمود الضريبة يكون واضح الرقم دا شامل الضريبة ام لا» — store
    # what the site gives, unmodified, and let the tax column say whether that
    # number includes tax. Nothing here is multiplied by anything.
    #
    #   shape                count   what GraphQL answers      stored as
    #   SimpleProduct          399   the printed price          vat_included=1
    #   GroupedProduct          33   no group price at all —    vat_included=1
    #                                one row per MEMBER, and    (per member)
    #                                the members match 28/28
    #   ConfigurableProduct    328   the shop's own basePrice   vat_included=0
    #
    # The configurable gap is not a ratio guess, and it was re-checked live on
    # 2026-07-25 by a second pass that fetched the pages itself. 12512-TSP:
    # GraphQL answers 50.4, and the page publishes
    #   "prices":{"baseOldPrice":{"amount":50.4},"oldPrice":{"amount":57.96},
    #             "basePrice":{"amount":50.4},"finalPrice":{"amount":57.96}}
    # with «initialFinalPrice: 57.96» — beside its own declarations
    # «finalPriceExclTaxKey = 'basePrice'» and «finalPriceInclTaxKey =
    # 'finalPrice'». The shop names which of its two figures excludes tax, and
    # the API hands us that one. The control: SimpleProduct 71231005 answers
    # 65.21 in the API against «initialFinalPrice: 65.205» on its page — no gap.
    #
    # Which also explains the history. On 2026-07-23 a source-WIDE 15% uplift
    # was added because the Legrand floor box read 194.9 in the API and 224.14
    # on the page. 60402-LPF is a CONFIGURABLE and still answers 194.9 — that
    # reading was right for its shape. On 2026-07-25 the uplift was removed
    # because putty-1-kg-sab and uib-oxidized-bitumen showed no gap at all;
    # both are SIMPLE, and that reading was right for THEIRS. Both observations
    # were true. What was wrong, twice, was answering with arithmetic: the
    # uplift put 3,312 prices in the warehouse that no madar page has ever
    # printed. A stored price now always exists on the site, and the fact that
    # a configurable one is quoted before tax rides the row instead of being
    # baked into the number.
    #
    # A SEPARATE figure the page also shows: «حساب أعمال؟ افتح السعر: 4.03» is
    # the business-account price, which an anonymous crawl can never be charged
    # (the same shape as sika's trade tier). We store the visitor price and
    # never that one.
    vat_mode: incl
    api:
      # A statement of fact about ONE shape, not an instruction to convert. It
      # makes those 328 rows carry vat_included=0, so the Tax column reads
      # "Excl. 15%" on them and "Incl. 15%" on the simple rows beside them.
      configurable_prices_exclude_tax: true
    tax:
      # The rate for that label, with the sentence it was read from — every
      # madar product page carries this line under the price. 12512-TSP is the
      # URL because it is the product whose two LABELLED figures (basePrice
      # 50.4 excl, finalPrice 57.96 incl) are what makes the 15 a reading
      # rather than an assumption.
      - region: SA
        vat_mode: incl
        evidence: stated
        rate_pct: 15
        statement_text: >-
          الأسعار تشمل ضريبة القيمة المضافة 15%.
        statement_url: https://www.madar.com/12512-tsp.html
        statement_lang: ar
        verified_at: "2026-07-25"
    extract:
      - kind: product_prices
        scope: census          # first crawl is a full census; owner will replace
                               # with targeted categories after apply-decisions
      # The «المزيد من المعلومات» panel — manufacturer, country of manufacture,
      # origin, size, material type, coating, grade — arrives in the SAME
      # census response via custom_attributesV2 (verified live 2026-07-23).
      # The connector could read it all along; nothing asked for it.
      - kind: enrichment
        scope: census
    min_expected_rows: 50
    max_drop_pct: 50
    notes: >
      Stores en_SA + ar_SA (ar gives Arabic names free). 760 products in three
      shapes, all three recorded, each at the figure the API states — see the
      per-shape price semantics above for which of them is quoted before tax.
      A grouped product yields ONE ROW PER MEMBER, because its page has no
      product price: it lists the members and prices each. Business-segment
      prices and per-branch availability need a session (extension capture,
      Phase 4).

