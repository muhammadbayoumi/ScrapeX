<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  A Linux stand-in for the one thing Windows does to the sans stack that Linux does
  not: its Helvetica carries Arabic. Chromium aliases a missing Helvetica to Arial
  (third_party/blink/renderer/platform/fonts/alternate_font_family.h:96-102, "Alias
  Arial and Helvetica"), Windows has no Helvetica, and Windows' Arial carries Arabic.
  Here Helvetica is Liberation Sans, which has none, so without this file no Linux run
  can see a stack that puts Helvetica ahead of the shipped Arabic face.

  Both names resolve to DejaVu Sans, a face with Arabic. binding="strong" is what makes
  Chromium accept the substitute rather than fall through to the next family.
  tests/test_the_faces_load_on_both_surfaces.py launches a second Chromium with
  FONTCONFIG_FILE pointing here, and first proves the rule took: a Helvetica run of
  Arabic must draw in a face the product does not ship.

  No double hyphen anywhere in this comment: XML refuses one, and fontconfig then
  loads no rule from this file at all.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="first"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
